type: cli
name: openspec-mock
version: 1.0.0
description: OpenSpec CLI 测试替身
install:
  run: sh scripts/install.sh
verify:
  command: [sh, -c, "test -f \"$HOME/.work/openspec-mock-installed\""]
uninstall:
  # 卸载走脚本（与 install 对称）：cmd.exe 直接执行 rm 时 $HOME 不展开，
  # 引号经 YAML/cmd/sh 三层转义后也会破碎；脚本内展开最稳
  run: sh scripts/uninstall.sh
