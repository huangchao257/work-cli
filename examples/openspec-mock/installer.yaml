type: cli
name: openspec-mock
version: 1.0.0
description: OpenSpec CLI 测试替身
install:
  run: sh scripts/install.sh
verify:
  command: [sh, -c, "test -f \"$HOME/.work/openspec-mock-installed\""]
uninstall:
  run: rm -f "$HOME/.work/openspec-mock-installed"
  platforms:
    # Windows runner 的 cmd.exe 不展开 $HOME；原样传给 rm 后删除字面路径落空。
    # 显式经 sh -c 执行，$HOME 由 sh 展开（runner 自带 Git 的 sh.exe）
    windows:
      run: sh -c "rm -f \"$HOME/.work/openspec-mock-installed\""
